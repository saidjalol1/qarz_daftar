<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qarz Daftar</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body data-page="login">

<section class="login">
  <div class="login-art">
    <div class="brand"><i>Q</i> <span data-i18n="app.name">Qarz Daftar</span></div>
    <div>
      <h1 data-i18n="login.hero">Har bir qarz o'z o'rnida.</h1>
      <p style="margin-top:14px" data-i18n="login.lead">Kim qancha qarz olgani, qachon va qancha to'lagani — hammasi bir daftarda.</p>
    </div>
    <div class="ledger-sample" aria-hidden="true">
      <div><span data-i18n="login.sampleTotal">Umumiy qarz</span><span class="num">4 800 000</span></div>
      <div><span data-i18n="login.samplePaid">To'langan</span><span class="num">− 1 500 000</span></div>
      <div><span data-i18n="login.sampleLeft">Qoldiq</span><span class="num">3 300 000</span></div>
    </div>
  </div>
  <div class="login-form">
    <form id="loginForm" novalidate>
      <div class="script-switch" data-script-switch></div>
      <div><h2 data-i18n="login.title">Tizimga kirish</h2><p class="hint" data-i18n="login.hint">Email va parolingizni kiriting</p></div>
      <div class="field"><label for="lEmail">Email</label><input class="input" id="lEmail" type="email" autocomplete="username" value="admin@qarzdaftar.uz"></div>
      <div class="field"><label for="lPass" data-i18n="login.pass">Parol</label><input class="input" id="lPass" type="password" autocomplete="current-password" value="admin123"></div>
      <div class="err" id="lErr" role="alert"></div>
      <button class="btn primary" type="submit" data-i18n="login.submit">Kirish</button>
      <p class="hint" data-i18n="login.demo">Demo: admin@qarzdaftar.uz / admin123</p>
    </form>
  </div>
</section>

<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/helpers.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
