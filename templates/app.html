{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/app.css' %}">
{% endblock %}

{% block body %}
{% csrf_token %}
<div class="app">
  <aside class="side">
    <div class="brand"><i>Q</i> <span data-i18n="app.name">Qarz Daftar</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <div class="side-fx">
      <div class="script-switch" data-script-switch></div>
      <div class="script-switch" data-cur-switch></div>
      <label class="rate-box"><span data-i18n="cur.rate">1 USD kurs</span><input class="input" id="usdRate" type="number" min="1" step="0.01" readonly><small id="usdRateHint"></small></label>
    </div>
    <div class="me">
      <div class="who-me"><b id="meName"></b><span id="meRole"></span></div>
      <button id="logout" title="Chiqish" aria-label="Chiqish" data-i18n-aria="nav.logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="modalRoot"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/i18n.js' %}"></script>
<script src="{% static 'js/helpers.js' %}"></script>
<script src="{% static 'js/ui.js' %}"></script>
<script src="{% static 'js/shell.js' %}"></script>
{% block page_js %}{% endblock %}
{% endblock %}
