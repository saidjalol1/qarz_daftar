<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#047857"/>
  
  <!-- Ledger/Notebook -->
  <rect x="140" y="100" width="232" height="312" rx="12" fill="#ffffff"/>
  
  <!-- Binding holes -->
  <circle cx="180" cy="140" r="8" fill="#047857"/>
  <circle cx="180" cy="200" r="8" fill="#047857"/>
  <circle cx="180" cy="260" r="8" fill="#047857"/>
  <circle cx="180" cy="320" r="8" fill="#047857"/>
  <circle cx="180" cy="380" r="8" fill="#047857"/>
  
  <!-- Lines representing text/entries -->
  <line x1="220" y1="160" x2="340" y2="160" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="190" x2="320" y2="190" stroke="#D1FAE5" stroke-width="6" stroke-linecap="round"/>
  
  <line x1="220" y1="230" x2="340" y2="230" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="260" x2="300" y2="260" stroke="#D1FAE5" stroke-width="6" stroke-linecap="round"/>
  
  <line x1="220" y1="300" x2="340" y2="300" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="330" x2="310" y2="330" stroke="#D1FAE5" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Currency symbol overlay (stylized sum/dollar) -->
  <circle cx="380" cy="360" r="52" fill="#F59E0B" opacity="0.95"/>
  <text x="380" y="388" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">₴</text>
</svg>
